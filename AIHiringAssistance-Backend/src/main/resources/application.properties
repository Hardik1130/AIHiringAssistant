spring.application.name=AIHiringAssistance

#spring.datasource.url=jdbc:mysql://localhost:3306/ai_hiring_db?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=admin

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000

# ===============================
# Logging (Readable SQL)
# ===============================
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


spring.rest.template.connect-timeout=15000
spring.rest.template.read-timeout=30000
#logging.level.com.devstringx.AIHiringAssistance.AILayer=DEBUG
ai.retry.max-attempts=2
ai.retry.backoff-ms=1000
ai.fallback.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

